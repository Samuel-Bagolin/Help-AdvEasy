<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCzyUBojyFVXk51F0dHljwu-mXrXO5xTHQ",
  authDomain: "help-adveasy.firebaseapp.com",
  projectId: "help-adveasy",
  storageBucket: "help-adveasy.firebasestorage.app",
  messagingSenderId: "276084634810",
  appId: "1:276084634810:web:b8733e51aeca8db3653e83",
  measurementId: "G-H7Q09XFCP9"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

let pages = [];

onSnapshot(collection(db,"pages"), snapshot => {

  pages = [];

  snapshot.forEach(docItem => {

    pages.push({
      id:docItem.id,
      ...docItem.data()
    });

  });

  renderHomePages();
  renderFaqPages();

});

</script>
