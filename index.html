<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Central de Ajuda - AdvEasy</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  scroll-behavior:smooth;
}

body{
  font-family:'Inter',sans-serif;
  background:#ffffff;
  color:#0f172a;
}

.header{
  width:100%;
  height:85px;
  border-bottom:1px solid #ececec;
  background:#fff;
  position:sticky;
  top:0;
  z-index:999;
}

.header-content{
  max-width:1400px;
  height:100%;
  margin:auto;
  padding:0 40px;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  height:44px;
  cursor:pointer;
}

.login-btn{
  border:1px solid #c8a24d;
  color:#8f6a1c;
  padding:12px 24px;
  border-radius:12px;
  font-weight:600;
  text-decoration:none;
}

.hero{
  padding:50px 30px 20px;
}

.hero-content{
  max-width:1400px;
  margin:auto;
}

.search-box{
  width:100%;
  max-width:1100px;
  border-bottom:2px solid #1e293b;

  display:flex;
  align-items:center;
  gap:16px;

  padding-bottom:18px;
}

.search-box input{
  width:100%;
  border:none;
  outline:none;
  font-size:22px;
}

.categories{
  max-width:1400px;
  margin:60px auto;
  padding:0 30px;

  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:30px;
}

.category-card{
  border:1px solid #ececec;
  border-radius:18px;
  padding:30px;
  cursor:pointer;
}

.card-top{
  display:flex;
  gap:18px;
}

.card-icon{
  width:70px;
  height:70px;
  border-radius:18px;
  background:#111827;

  display:flex;
  align-items:center;
  justify-content:center;
}

.card-icon img{
  width:34px;
  height:34px;
  object-fit:contain;
}

.card-text h2{
  font-size:30px;
  margin-bottom:10px;
}

.card-text p{
  color:#64748b;
}

.faq-page{
  display:none;
  max-width:1200px;
  margin:50px auto 100px;
  padding:0 30px;
}

.back-btn{
  margin-bottom:30px;
  cursor:pointer;
  color:#8f6a1c;
  font-weight:600;
}

.faq-box{
  border:1px solid #ececec;
  border-radius:20px;
  overflow:hidden;
}

.faq-item{
  border-bottom:1px solid #ececec;
}

.faq-question{
  width:100%;
  border:none;
  background:#fff;
  padding:28px 34px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  cursor:pointer;
}

.faq-answer{
  max-height:0;
  overflow:hidden;
  transition:.3s;
}

.faq-answer-content{
  padding:0 34px 30px;
  color:#475569;
  line-height:30px;
}

.faq-item.active .faq-answer{
  max-height:500px;
}

.footer{
  border-top:1px solid #ececec;
  padding:40px 20px;
  text-align:center;
}

.footer img{
  height:40px;
  cursor:pointer;
}

</style>

</head>

<body>

<header class="header">

  <div class="header-content">

    <img
      src="https://adveasy.com.br/wp-content/uploads/2023/01/result-3.svg"
      class="logo"
      onclick="goHome()"
    >

    <a
      href="https://web.homol.advogado.adveasy.com.br/"
      class="login-btn"
      target="_blank"
    >
      Login
    </a>

  </div>

</header>

<section class="hero">

  <div class="hero-content">

    <div class="search-box">

      <span>⌕</span>

      <input
        type="text"
        id="searchInput"
        placeholder="Pesquisar artigos..."
      >

    </div>

  </div>

</section>

<section id="homePage">

  <div class="categories"></div>

</section>

<footer class="footer">

  <img
    src="https://adveasy.com.br/wp-content/uploads/2023/01/result-3.svg"
    onclick="goHome()"
  >

</footer>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// FIREBASE

const firebaseConfig = {
  apiKey: "AIzaSyCzyUBojyFVXk51F0dHljwu-mXrXO5xTHQ",
  authDomain: "help-adveasy.firebaseapp.com",
  projectId: "help-adveasy",
  storageBucket: "help-adveasy.firebasestorage.app",
  messagingSenderId: "276084634810",
  appId: "1:276084634810:web:b8733e51aeca8db3653e83",
  measurementId: "G-H7Q09XFCP9"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

// DADOS

let pages = [];

// RENDER

function render(){

  const categories =
    document.querySelector(".categories");

  categories.innerHTML = "";

  document.querySelectorAll(".faq-page")
    .forEach(el => el.remove());

  pages.forEach(page => {

    categories.innerHTML += `

      <div
        class="category-card"
        onclick="openPage('${page.id}')"
      >

        <div class="card-top">

          <div class="card-icon">

            <img src="${page.icon}">

          </div>

          <div class="card-text">

            <h2>${page.name}</h2>

            <p>${page.desc}</p>

          </div>

        </div>

      </div>

    `;

    let questionsHTML = "";

    page.questions.forEach(question => {

      questionsHTML += `

        <div class="faq-item">

          <button class="faq-question">

            <h3>${question.title}</h3>

            <span>›</span>

          </button>

          <div class="faq-answer">

            <div class="faq-answer-content">

              ${question.answer}

            </div>

          </div>

        </div>

      `;

    });

    document.body.insertAdjacentHTML(
      "beforeend",
      `

      <section class="faq-page" id="${page.id}">

        <div
          class="back-btn"
          onclick="goHome()"
        >
          ← Voltar
        </div>

        <h1 style="margin-bottom:30px;">
          ${page.name}
        </h1>

        <div class="faq-box">

          ${questionsHTML}

        </div>

      </section>

      `
    );

  });

  bindEvents();

}

// FAQ

function bindEvents(){

  document.querySelectorAll(".faq-question")
    .forEach(btn => {

      btn.onclick = () => {

        btn.parentElement
          .classList.toggle("active");

      };

    });

}

// OPEN PAGE

window.openPage = function(id){

  document.getElementById("homePage")
    .style.display = "none";

  document.querySelectorAll(".faq-page")
    .forEach(page => {
      page.style.display = "none";
    });

  const target =
    document.getElementById(id);

  if(target){
    target.style.display = "block";
  }

  window.scrollTo(0,0);

}

// HOME

window.goHome = function(){

  document.getElementById("homePage")
    .style.display = "block";

  document.querySelectorAll(".faq-page")
    .forEach(page => {
      page.style.display = "none";
    });

}

// SEARCH

document.getElementById("searchInput")
  .addEventListener("keyup", function(){

    const value =
      this.value.toLowerCase();

    document.querySelectorAll(".category-card")
      .forEach(card => {

        const text =
          card.innerText.toLowerCase();

        card.style.display =
          text.includes(value)
          ? "block"
          : "none";

      });

});

// REALTIME FIREBASE

onSnapshot(collection(db,"pages"), snapshot => {

  pages = [];

  snapshot.forEach(docItem => {

    pages.push({
      id:docItem.id,
      ...docItem.data()
    });

  });

  render();

});

</script>

</body>
</html>
