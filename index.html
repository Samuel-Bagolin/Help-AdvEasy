<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Central de Ajuda - AdvEasy</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      scroll-behavior:smooth;
    }

    body{
      font-family:'Inter',sans-serif;
      background:#ffffff;
      color:#0f172a;
    }

    a{
      text-decoration:none;
      color:inherit;
    }

    /* HEADER */

    .header{
      width:100%;
      height:85px;
      border-bottom:1px solid #ececec;
      background:#fff;
      position:sticky;
      top:0;
      z-index:999;
    }

    .header-content{
      max-width:1400px;
      height:100%;
      margin:auto;
      padding:0 40px;

      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .logo{
      height:44px;
      cursor:pointer;
    }

    .login-btn{
      border:1px solid #c8a24d;
      color:#8f6a1c;
      padding:12px 24px;
      border-radius:12px;
      font-weight:600;
      transition:.2s;
    }

    .login-btn:hover{
      background:#c8a24d;
      color:#fff;
    }

    /* HERO */

    .hero{
      padding:50px 30px 20px;
    }

    .hero-content{
      max-width:1400px;
      margin:auto;
    }

    .search-box{
      width:100%;
      max-width:1100px;
      border-bottom:2px solid #1e293b;

      display:flex;
      align-items:center;
      gap:16px;

      padding-bottom:18px;
    }

    .search-box span{
      font-size:24px;
      color:#64748b;
    }

    .search-box input{
      width:100%;
      border:none;
      outline:none;
      font-size:22px;
      background:transparent;
      color:#0f172a;
    }

    .search-box input::placeholder{
      color:#64748b;
    }

    /* HOME */

    #homePage{
      display:block;
    }

    .categories{
      max-width:1400px;
      margin:60px auto;
      padding:0 30px;

      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
      gap:30px;
    }

    .category-card{
      border:1px solid #ececec;
      border-radius:18px;
      padding:30px;
      cursor:pointer;
      transition:.2s;
      background:#fff;
    }

    .category-card:hover{
      transform:translateY(-4px);
      border-color:#c8a24d;
      box-shadow:0 12px 30px rgba(0,0,0,.06);
    }

    .card-top{
      display:flex;
      align-items:flex-start;
      gap:18px;
    }

    /* ALTERAÇÃO DOS ÍCONES */

    .card-icon{
      width:70px;
      height:70px;
      border-radius:18px;

      background:#ffffff;
      border:2px solid #c8a24d;

      display:flex;
      align-items:center;
      justify-content:center;

      flex-shrink:0;
    }

    .card-icon img{
      width:36px;
      height:36px;
      object-fit:contain;
    }

    .card-text h2{
      font-size:30px;
      margin-bottom:10px;
    }

    .card-text p{
      color:#64748b;
      line-height:28px;
      font-size:17px;
    }

    /* FAQ PAGE */

    .faq-page{
      display:none;
      max-width:1200px;
      margin:50px auto 100px;
      padding:0 30px;
    }

    .breadcrumb{
      color:#64748b;
      margin-bottom:30px;
      font-size:15px;
    }

    .faq-header{
      display:flex;
      align-items:center;
      gap:20px;
      margin-bottom:40px;
    }

    /* ALTERAÇÃO DOS ÍCONES */

    .faq-header-icon{
      width:90px;
      height:90px;
      border-radius:22px;

      background:#ffffff;
      border:2px solid #c8a24d;

      display:flex;
      align-items:center;
      justify-content:center;

      flex-shrink:0;
    }

    .faq-header-icon img{
      width:42px;
      height:42px;
      object-fit:contain;
    }

    .faq-header h1{
      font-size:48px;
      margin-bottom:10px;
    }

    .faq-header p{
      font-size:20px;
      color:#64748b;
    }

    .faq-box{
      border:1px solid #e7e7e7;
      border-radius:20px;
      overflow:hidden;
    }

    .faq-item{
      border-bottom:1px solid #ececec;
    }

    .faq-item:last-child{
      border-bottom:none;
    }

    .faq-question{
      width:100%;
      background:#fff;
      border:none;

      padding:28px 34px;

      display:flex;
      align-items:center;
      justify-content:space-between;

      cursor:pointer;
      transition:.2s;
    }

    .faq-question:hover{
      background:#fafafa;
    }

    .faq-question h3{
      font-size:22px;
      font-weight:500;
      text-align:left;
    }

    .faq-arrow{
      font-size:28px;
      color:#c8a24d;
      transition:.3s;
    }

    .faq-answer{
      max-height:0;
      overflow:hidden;
      transition:max-height .3s ease;
    }

    .faq-answer-content{
      padding:0 34px 30px;
      color:#475569;
      line-height:32px;
      font-size:17px;
    }

    .faq-item.active .faq-answer{
      max-height:500px;
    }

    .faq-item.active .faq-arrow{
      transform:rotate(90deg);
    }

    .back-btn{
      margin-bottom:35px;

      display:inline-flex;
      align-items:center;
      gap:10px;

      color:#8f6a1c;
      font-weight:600;
      cursor:pointer;
    }

    @media(max-width:768px){

      .header-content{
        padding:0 20px;
      }

      .categories{
        grid-template-columns:1fr;
      }

      .faq-header{
        flex-direction:column;
        align-items:flex-start;
      }

      .faq-header h1{
        font-size:34px;
      }

      .faq-question{
        padding:22px;
      }

      .faq-answer-content{
        padding:0 22px 24px;
      }

      .faq-question h3{
        font-size:18px;
      }

    }

  </style>

</head>

<body>

  <header class="header">

    <div class="header-content">

      <img
        src="https://adveasy.com.br/wp-content/uploads/2023/01/result-3.svg"
        class="logo"
        alt="AdvEasy"
        onclick="goHome()"
      >

      <a
        href="https://web.homol.advogado.adveasy.com.br/"
        target="_blank"
        class="login-btn"
      >
        Login
      </a>

    </div>

  </header>

  <section class="hero">

    <div class="hero-content">

      <div class="search-box">

        <span>⌕</span>

        <input
          type="text"
          id="searchInput"
          placeholder="Pesquisar artigos..."
        >

      </div>

    </div>

  </section>

  <section id="homePage">

    <div class="categories"></div>

  </section>

  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getFirestore,
      collection,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCzyUBojyFVXk51F0dHljwu-mXrXO5xTHQ",
      authDomain: "help-adveasy.firebaseapp.com",
      projectId: "help-adveasy",
      storageBucket: "help-adveasy.firebasestorage.app",
      messagingSenderId: "276084634810",
      appId: "1:276084634810:web:b8733e51aeca8db3653e83",
      measurementId: "G-H7Q09XFCP9"
    };

    const app = initializeApp(firebaseConfig);

    const db = getFirestore(app);

    let pages = [];

    function renderHomePages(){

      const categories =
        document.querySelector(".categories");

      categories.innerHTML = "";

      if(pages.length === 0){

        categories.innerHTML = `

          <div
            style="
              width:100%;
              padding:80px 20px;
              text-align:center;
              color:#64748b;
              grid-column:1/-1;
            "
          >

            Nenhuma página cadastrada.

          </div>

        `;

        return;

      }

      pages.forEach(page => {

        categories.innerHTML += `

          <div
            class="category-card"
            onclick="openPage('${page.id}')"
          >

            <div class="card-top">

              <div class="card-icon">

                <img src="${page.icon}">

              </div>

              <div class="card-text">

                <h2>${page.name}</h2>

                <p>${page.desc}</p>

              </div>

            </div>

          </div>

        `;

      });

    }

    function renderFaqPages(){

      document.querySelectorAll(".faq-page").forEach(el => {
        el.remove();
      });

      pages.forEach(page => {

        let questionsHTML = "";

        if(!page.questions || page.questions.length === 0){

          questionsHTML = `

            <div class="faq-item active">

              <button class="faq-question">

                <h3>Conteúdo em atualização</h3>

                <span class="faq-arrow">›</span>

              </button>

              <div class="faq-answer">

                <div class="faq-answer-content">

                  Estamos preparando os artigos desta categoria.

                </div>

              </div>

            </div>

          `;

        }else{

          page.questions.forEach(question => {

            questionsHTML += `

              <div class="faq-item">

                <button class="faq-question">

                  <h3>${question.title}</h3>

                  <span class="faq-arrow">›</span>

                </button>

                <div class="faq-answer">

                  <div class="faq-answer-content">

                    ${question.answer}

                  </div>

                </div>

              </div>

            `;

          });

        }

        document.body.insertAdjacentHTML(
          "beforeend",
          `

          <section class="faq-page" id="${page.id}">

            <div class="back-btn" onclick="goHome()">
              ← Voltar
            </div>

            <div class="breadcrumb">
              Todas as coleções > ${page.name}
            </div>

            <div class="faq-header">

              <div class="faq-header-icon">

                <img src="${page.icon}">

              </div>

              <div>

                <h1>${page.name}</h1>

                <p>${page.desc}</p>

              </div>

            </div>

            <div class="faq-box">

              ${questionsHTML}

            </div>

          </section>

          `
        );

      });

      bindFaqEvents();

    }

    function bindFaqEvents(){

      document.querySelectorAll('.faq-question').forEach(question => {

        question.addEventListener('click', () => {

          const item = question.parentElement;

          item.classList.toggle('active');

        });

      });

    }

    window.openPage = function(id){

      document.getElementById('homePage').style.display = 'none';

      document.querySelectorAll('.faq-page').forEach(page => {
        page.style.display = 'none';
      });

      const target = document.getElementById(id);

      if(target){
        target.style.display = 'block';
      }

      window.scrollTo(0,0);

    }

    window.goHome = function(){

      document.querySelectorAll('.faq-page').forEach(page => {
        page.style.display = 'none';
      });

      document.getElementById('homePage').style.display = 'block';

      document.getElementById('searchInput').value = '';

      document.querySelectorAll('.category-card').forEach(card => {
        card.style.display = 'block';
      });

      window.scrollTo(0,0);

    }

    const searchInput =
      document.getElementById('searchInput');

    searchInput.addEventListener('keyup', function(){

      const value =
        this.value.toLowerCase();

      const cards =
        document.querySelectorAll('.category-card');

      cards.forEach(card => {

        const text =
          card.innerText.toLowerCase();

        if(text.includes(value)){

          card.style.display = 'block';

        }else{

          card.style.display = 'none';

        }

      });

    });

    onSnapshot(collection(db,"pages"), snapshot => {

      pages = [];

      snapshot.forEach(doc => {

        pages.push({
          id:doc.id,
          ...doc.data()
        });

      });

      renderHomePages();
      renderFaqPages();

    });

  </script>

</body>
</html>
